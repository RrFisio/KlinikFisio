<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Pasien — Klinik Fisioterapi</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <div class="content-wrap wide">
      <h1>Daftar Pasien</h1>
      <p class="lede">Klik nama pasien untuk membuka kartu pasien: identitas, riwayat tindakan, dan jadwal fisioterapi.</p>

      <div class="searchbar">
        <input type="text" id="search" placeholder="Cari nama pasien...">
      </div>

      <div class="card">
        <table id="tabel-pasien">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Tanggal Lahir</th>
              <th>Nomor HP</th>
              <th>Keluhan</th>
              <th>Terdaftar</th>
            </tr>
          </thead>
          <tbody id="tbody-pasien">
            <tr><td colspan="5" class="empty">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/sidebar.js"></script>
<script>
let semuaPasien = [];

function formatTanggal(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function renderTabel(list) {
  const tbody = document.getElementById('tbody-pasien');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Belum ada pasien terdaftar.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(p => `
    <tr>
      <td><a href="kartu.html?id=${p.id}">${escapeHtml(p.nama)}</a></td>
      <td>${formatTanggal(p.tanggal_lahir)}</td>
      <td>${escapeHtml(p.nomor_hp || '-')}</td>
      <td>${escapeHtml(p.keluhan).slice(0, 50)}${p.keluhan.length > 50 ? '…' : ''}</td>
      <td>${formatTanggal(p.created_at)}</td>
    </tr>
  `).join('');
}

async function muatPasien() {
  const { data, error } = await supabaseClient
    .from('pasien')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('tbody-pasien').innerHTML =
      `<tr><td colspan="5" class="empty">Gagal memuat data: ${error.message}</td></tr>`;
    return;
  }
  semuaPasien = data;
  renderTabel(semuaPasien);
}

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  renderTabel(semuaPasien.filter(p => p.nama.toLowerCase().includes(q)));
});

(async () => {
  const ok = await wajibLogin();
  if (!ok) return;
  renderSidebar('pasien');
  muatPasien();
})();
</script>

</body>
</html>
